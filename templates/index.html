    <div class="jumbotron text-center">
  <h1>Welcome to Zumba Class</h1>
  <p>Please Choose one of the following options</p> 
</div>
<div class="container">
    <!--<h1>My Form</h1>-->


    <h1>Select an option</h1>

<selectm id="myDropdown"> <option value="">-- Choose an option --</option> {% for option in options %} <option value="{{ option }}">{{ option }}</option> {% endfor %} </select>


    <p id="result"></p>
<p>Selected option: <span id="selectedOption"></span></p>

    <script>
        const dropdown = document.getElementById("myDropdown");
        const selectedOption = document.getElementById("selectedOption");
        const result = document.getElementById("result");
         const participantField = document.getElementById("participantField");
        // Show selection on screen
        dropdown.addEventListener("change", function() {
            selectedOption.textContent = dropdown.value;
        });
        // Send selection to Flask fetch("/select", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ option: dropdown.value }) }) .then(response => response.json()) .then(data => { result.textContent = data.message; });
      dropdown.addEventListener("change", function() { 
        selectedOption.textContent = dropdown.value; 
        fetch("/select", 
        { method: "POST",
       headers: { "Content-Type": "application/json" },
       body: JSON.stringify({ option: dropdown.value }) }) .then(response => response.json()) .then(data => 
      { result.textContent = data.message; if (data.show_field) { participantField.style.display = "block"; } else 
      { participantField.style.display = "none"; } }); });  
       

    </script>

      <form action="/submit" method="POST">
            <label>Name:</label>
            <input type="text" name="name">
            <br><br>
            <label>Email:</label>
            <input type="email" name="email">
             <br><br>
             <button type="submit">Submit</button>

    </form>
