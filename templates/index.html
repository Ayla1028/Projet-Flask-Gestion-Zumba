<!DOCTYPE html>
<html>


<head>
  <title>My Form</title>


  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">


  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>


<body class="bg-info">


  <div class="text-center p-5">
    <h1>Welcome to Zumba Class</h1>
    <p>Please Choose one of the following options</p>
  </div>


  <div class="container">


    <h1>Select an option</h1>


    <select id="myDropdown">
      <option value="">-- Choose an option --</option>


      {% for option in options %}
      <option value="{{ option }}">{{ option }}</option>
      {% endfor %}
    </select>


    <p>
      Selected option:
      <span id="selectedOption"></span>
    </p>


    <p id="result"></p>


    <!-- Participant field -->
    <div id="participantField" style="display: none;">
      <label>Participant name:</label>
      <input type="text" id="participantName">
    </div>


    <br>
    <!-- ADDED BY CLAUDIA -->
    <form id="addParticipantForm" action="/submit" method="POST" style="display: none;">

      # Name age gender level danceType
      <label>Age of new participant</label>
      <input type="text" name="age">

<br><br>

      <label>Name:</label>
      <input type="text" name="name">

      <br><br>

      <form action="/action_page.php">
        <label for="birthday">Date of Birth:</label>
        <input type="date" id="birthday" name="birthday">
        <input type="submit">
      </form>
      <br>

     <label>Gender</label>
     <br>

     <input type="radio" id="girl" name="gender" value="girl">
     <label for="girl">girl</label><br>
      <input type="radio" id="boy" name="gender" value="boy">
     <label for="boy">boy</label><br>
      <input type="radio" id="non binary" name="gender" value="non binary">
     <label for="non binary">non binary</label>
     <br><br>

<label>Choose a level</label>

<br>

     <select id="myDropdown">
      <option value="">-- Choose a level --</levels>


      {% for levels in levels %}
      <option value="{{ levels }}">{{ levels }}</levels>
      {% endfor %}
     </select>

      <br><br>
      <select id="myDropdown">
      <option value="">-- Choose a dance types --</danceTypes>


      {% for danceTypes
      <option value="{{ danceTypes }}">{{ danceTypes }}</danceTypes>
      {% endfor %}
     </select>


      <br><br>



      <button type="submit">Submit</button>


    </form>
    <!-- ADDED BY CLAUDIA -->
  </div>




  <script>
    const dropdown = document.getElementById("myDropdown");
    const selectedOption = document.getElementById("selectedOption");
    const result = document.getElementById("result");
    const participantField = document.getElementById("participantField");
    const addParticipantForm = document.getElementById("addParticipantForm");




    dropdown.addEventListener("change", function () {


      selectedOption.textContent = dropdown.value;




      fetch("/select", {
          method: "POST",


          headers: {
            "Content-Type": "application/json"
          },


          body: JSON.stringify({
            option: dropdown.value
          })
        })


        .then(response => response.json())


        .then(data => {


          result.textContent = data.message;
          /* Modified by Claudia */
          if (data.show_field) {
            participantField.style.display = "block";
          } else {
            participantField.style.display = "none";
          }


          if (data.show_add_form) {
            addParticipantForm.style.display = "block";
            result.textContent = data.message
          } else {
            addParticipantForm.style.display = "none";
          }
          /* Modified by Claudia */
        });


    });
  </script>


</body>


</html>
